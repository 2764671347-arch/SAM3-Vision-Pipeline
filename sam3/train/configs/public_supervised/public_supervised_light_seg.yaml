# @package _global_
defaults:
  - _self_

paths:
  public_data_root: <YOUR_DATASET_ROOT>
  experiment_log_dir: <YOUR_EXPERIMENT_LOG_DIR>
  bpe_path: <BPE_PATH>
  checkpoint_path: null
  prompt_metadata_path: null

dataset:
  train:
    img_folder: train
    ann_file: annotations/train.json
  val:
    img_folder: val
    ann_file: annotations/val.json

public_train:
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 384
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.val_norm_mean}
          std: ${scratch.val_norm_std}

  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0
          presence_loss: 10.0
        pos_weight: 5.0
        alpha: 0.25
        gamma: 2
        use_presence: True
        pos_focal: false
        pad_n_queries: ${scratch.num_queries}
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 120.0
          loss_dice: 10.0
        compute_aux: false
    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
      presence_head: True
      presence_loss: False
      focal: True
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: False
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: true
  use_presence_eval: True
  consistent_transform: False
  max_ann_per_img: 200
  scale_by_find_batch_size: True

  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False

  mask_postprocessor_thresholded:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: false
    use_original_sizes_box: false
    use_original_sizes_mask: true
    convert_mask_to_rle: True
    detection_threshold: 0.3
    use_presence: ${scratch.use_presence_eval}

  resolution: 672
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  train_batch_size: 1
  val_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_workers: 4
  num_val_workers: 2
  max_data_epochs: 24
  gather_pred_via_filesys: false
  lr_transformer: 2.0e-4
  lr_vision_backbone: 1.0e-4
  lr_language_backbone: 5.0e-5
  wd: 0.05
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20
  lrd_vision_backbone: 0.9

  image_size: 672
  patch_size: 14
  pretrain_img_size: 336
  d_model: 192
  transformer_heads: 8
  encoder_layers: 4
  decoder_layers: 4
  transformer_ffn_dim: 1536
  encoder_dropout: 0.1
  decoder_dropout: 0.1
  num_queries: 80
  geo_encoder_layers: 2
  vit_embed_dim: 768
  vit_depth: 16
  vit_num_heads: 12
  vit_mlp_ratio: 4.0
  vit_drop_path_rate: 0.1
  vit_global_att_blocks: [3, 7, 11, 15]
  vit_window_size: 16
  text_width: 768
  text_layers: 12
  text_heads: 12
  prompt_mlp_hidden_dim: 1536
  segmentation_upsampling_stages: 3

  freeze_image_tower: false
  freeze_text_tower: false
  freeze_transformer: false
  freeze_prompt_scorer: false
  freeze_segmentation_head: false
  freeze_geometry_encoder: false

  train_category_chunk_size: 8
  val_category_chunk_size: 32

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: True
  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 2
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${public_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        transforms: ${public_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.public_data_root}/${dataset.train.img_folder}
        ann_file: ${paths.public_data_root}/${dataset.train.ann_file}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          prompts: ${paths.prompt_metadata_path}
          include_negatives: true
          category_chunk_size: ${scratch.train_category_chunk_size}
          randomize_prompt: true
          _partial_: true
      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn:
        _target_: sam3.train.data.collator.collate_fn_api
        _partial_: true
        repeats: 1
        dict_key: all
        with_seg_masks: ${scratch.enable_segmentation}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        transforms: ${public_train.val_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 100000
        multiplier: 1
        training: false
        img_folder: ${paths.public_data_root}/${dataset.val.img_folder}
        ann_file: ${paths.public_data_root}/${dataset.val.ann_file}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          prompts: ${paths.prompt_metadata_path}
          include_negatives: true
          category_chunk_size: ${scratch.val_category_chunk_size}
          randomize_prompt: false
          _partial_: true
      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn:
        _target_: sam3.train.data.collator.collate_fn_api
        _partial_: true
        repeats: 1
        dict_key: public_supervised
        with_seg_masks: ${scratch.enable_segmentation}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    checkpoint_path: ${paths.checkpoint_path}
    load_from_HF: false
    enable_segmentation: ${scratch.enable_segmentation}
    image_size: ${scratch.image_size}
    patch_size: ${scratch.patch_size}
    pretrain_img_size: ${scratch.pretrain_img_size}
    d_model: ${scratch.d_model}
    transformer_heads: ${scratch.transformer_heads}
    encoder_layers: ${scratch.encoder_layers}
    decoder_layers: ${scratch.decoder_layers}
    transformer_ffn_dim: ${scratch.transformer_ffn_dim}
    encoder_dropout: ${scratch.encoder_dropout}
    decoder_dropout: ${scratch.decoder_dropout}
    num_queries: ${scratch.num_queries}
    geo_encoder_layers: ${scratch.geo_encoder_layers}
    vit_embed_dim: ${scratch.vit_embed_dim}
    vit_depth: ${scratch.vit_depth}
    vit_num_heads: ${scratch.vit_num_heads}
    vit_mlp_ratio: ${scratch.vit_mlp_ratio}
    vit_drop_path_rate: ${scratch.vit_drop_path_rate}
    vit_global_att_blocks: ${scratch.vit_global_att_blocks}
    vit_window_size: ${scratch.vit_window_size}
    text_width: ${scratch.text_width}
    text_layers: ${scratch.text_layers}
    text_heads: ${scratch.text_heads}
    prompt_mlp_hidden_dim: ${scratch.prompt_mlp_hidden_dim}
    segmentation_upsampling_stages: ${scratch.segmentation_upsampling_stages}
    freeze_image_tower: ${scratch.freeze_image_tower}
    freeze_text_tower: ${scratch.freeze_text_tower}
    freeze_transformer: ${scratch.freeze_transformer}
    freeze_prompt_scorer: ${scratch.freeze_prompt_scorer}
    freeze_segmentation_head: ${scratch.freeze_segmentation_head}
    freeze_geometry_encoder: ${scratch.freeze_geometry_encoder}

  meters:
    val:
      public_supervised:
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/public_supervised
          merge_predictions: True
          postprocessor: ${scratch.mask_postprocessor_thresholded}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.public_data_root}/${dataset.val.ann_file}
              tide: False
              iou_type: "segm"

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: "backbone.vision_backbone.trunk"
        overrides:
          - pattern: "*pos_embed*"
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "backbone.vision_backbone.*"
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "backbone.language_backbone.*"

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - "*bias*"
          module_cls_names: ["torch.nn.LayerNorm"]

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/public_supervised
    log_freq: 10

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 48
  use_cluster: False
  cpus_per_task: 8
  port_range: [10000, 65000]
  constraint: null
